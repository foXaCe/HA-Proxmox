[mypy]
python_version = 3.12
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
follow_imports = skip

# Le fichier device_registry.py de HA (syntaxe Python 3.14) casse le parser
# mypy ; le code source de notre intégration est validé sans suivre les imports
# HA (déclarés Any par design).

[mypy-custom_components.proxmoxve.entity]
# coordinator.data / storages retournent Any car HA n'est pas suivi en mode skip
warn_return_any = false

[mypy-custom_components.proxmoxve.__init__]
warn_return_any = false
