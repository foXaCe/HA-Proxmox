[mypy]
python_version = 3.14
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
follow_imports = silent

# homeassistant est installé dans l'environnement de lint (voir .pre-commit-config.yaml
# et requirements_dev.txt) : les classes HA sont résolues et typées.
# follow_imports = silent : les erreurs de syntaxe/typage dans les fichiers HA
# eux-mêmes ne sont pas rapportées, mais les types remontent vers notre code.
# proxmoxer ne fournit pas de stubs -> ignoré via ignore_missing_imports.
