name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements_dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy custom_components/proxmoxve

  pre-commit:
    name: Pre-commit (prek)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install prek
        run: pipx install prek
      - name: Cache prek hooks
        uses: actions/cache@v6
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run prek
        run: prek run --all-files --show-diff-on-failure --color=always

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements_test.txt
      - run: pytest --cov=custom_components/proxmoxve --cov-report=xml --cov-report=term
      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          file: coverage.xml
          fail_ci_if_error: false
