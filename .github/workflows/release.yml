name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Open / maintain Release PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          release-type: simple
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-assets:
    name: Build + upload zip
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set manifest version
        # release-please ne bump pas toujours le manifest.json (jsonpath non
        # propagé via l'action) : on force la version du manifest ici pour que
        # le zip HACS embarque la bonne version.
        run: |
          VERSION="${{ needs.release-please.outputs.version }}"
          jq --arg v "$VERSION" '.version = $v' custom_components/proxmoxve/manifest.json \
            > /tmp/manifest.json && mv /tmp/manifest.json custom_components/proxmoxve/manifest.json
          echo "manifest version -> $(jq -r .version custom_components/proxmoxve/manifest.json)"

      - name: Build zip
        run: |
          # HACS zip_release extrait le zip dans custom_components/<domain>/ :
          # le zip doit donc contenir le CONTENU du dossier à la racine
          # (pas le dossier custom_components/proxmoxve/ imbriqué, sinon
          # double imbrication et HA retombe sur l'intégration core).
          cd custom_components/proxmoxve
          zip -r ../../proxmoxve.zip . -x "*.pyc" "__pycache__/*"
          cd ../..
          sha256sum proxmoxve.zip > proxmoxve.zip.sha256

      - name: Upload assets to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: |
            proxmoxve.zip
            proxmoxve.zip.sha256
          fail_on_unmatched_files: true
