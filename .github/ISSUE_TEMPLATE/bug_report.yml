name: Bug Report
description: Report a bug in Proxmox VE
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de fournir un maximum d'informations pour diagnostiquer rapidement.

  - type: input
    id: ha-version
    attributes:
      label: Home Assistant version
      placeholder: e.g. 2026.8.1
    validations:
      required: true

  - type: input
    id: integration-version
    attributes:
      label: Integration version
      placeholder: e.g. 2.0.0
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: Installation method
      options:
        - HACS
        - Manual
        - Other
    validations:
      required: true

  - type: textarea
    id: bug-description
    attributes:
      label: Bug description
      description: Que se passe-t-il ? Que devrait-il se passer ?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Settings → System → Logs (filtrer par proxmoxve)
      render: shell

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics dump
      description: Settings → Devices & Services → Proxmox VE → "..." → Download diagnostics
